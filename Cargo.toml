[package]
name = "rpocketflow"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
simple_logger = "4.0"
futures = "0.3.31"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
anthropic = "0.0.8"
mcpr = "0.1.0"
env_logger = "0.10"
thiserror = "1.0"

[dev-dependencies]
mockito = "1.2"
