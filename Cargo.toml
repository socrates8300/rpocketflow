[package]
name = "rpocketflow"
version = "0.1.1"
edition = "2021"
description = "A lightweight, flexible workflow orchestration library for Rust"
license = "MIT"
repository = "https://github.com/socrates8300/rpocketflow"

[dependencies]
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"], optional = true }
once_cell = "1.18"
log = "0.4"
simple_logger = "4.0"
futures = "0.3.31"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
anthropic = { version = "0.0.8", optional = true }
mcpr = "0.1.0"
env_logger = "0.10"
thiserror = "1.0"
tracing = "0.1"
chrono = { version = "0.4", optional = true }
walkdir = { version = "2.3", optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"
mockito = "1.2"
tokio-test = "0.4"

[features]
default = ["async", "mcp"]
async = ["tokio"]
mcp = ["anthropic", "chrono"]
source-crawler = ["walkdir"]

